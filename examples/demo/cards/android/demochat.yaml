---
id: RCP.ANDROID.DEMOCHAT.DAILY_CHECKIN
applies:
  os: ANDROID >=12
  app: DEMOCHAT >=5.0
steps:
  - open APP.ANDROID.DEMOCHAT
  - wait ELEM.ANDROID.DEMOCHAT.HOME shown 15s
  - if ELEM.ANDROID.DEMOCHAT.PROMO_CLOSE visible then click ELEM.ANDROID.DEMOCHAT.PROMO_CLOSE
  - if ELEM.ANDROID.DEMOCHAT.CHECKIN_DONE visible then end
  - click! ELEM.ANDROID.DEMOCHAT.CHECKIN_BUTTON
  - wait ELEM.ANDROID.DEMOCHAT.CHECKIN_DONE shown 10s
check:
  - ELEM.ANDROID.DEMOCHAT.CHECKIN_DONE visible
ends_at: ELEM.ANDROID.DEMOCHAT.HOME
evidence: simulated, passed check for 20 consecutive runs
counterexample: home page differs when logged out
state: stable
verified: {count: 20, last: 2026-11-12}
