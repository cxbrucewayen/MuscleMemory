id: RCP.WIN.DEMOCHAT.MAIN_TO_CONTACTS
applies:
  os: WIN >=10.0
  app: DEMOCHAT >=4.0
aliases:
  en: [open contacts]
  zh: [打开通讯录]
goal:
  en: Go from the main window to the contacts page
  zh: 从主界面进入通讯录
side_effect: none
requires:
  - ELEM.WIN.DEMOCHAT.MAIN visible
steps:
  - click ELEM.WIN.DEMOCHAT.NAV_CONTACTS
  - wait ELEM.WIN.DEMOCHAT.CONTACTS shown 5s
check:
  - ELEM.WIN.DEMOCHAT.CONTACTS visible
ends_at: ELEM.WIN.DEMOCHAT.CONTACTS
evidence: simulated, 4 runs passed check
counterexample: none known on 4.x
state: stable
verified: {count: 4, last: 2026-11-12}
