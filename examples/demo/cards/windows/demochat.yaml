---
id: RCP.WIN.DEMOCHAT.OPEN_PROFILE
applies:
  os: WIN >=10.0
  app: DEMOCHAT >=4.0
aliases:
  en: [open contact profile]
  zh: [打开联系人资料卡]
params: [contact]
goal: The profile card of {contact} is open
side_effect: none
requires:
  - ELEM.WIN.DEMOCHAT.CONTACTS visible
steps:
  - click ELEM.WIN.DEMOCHAT.CONTACT_SEARCH
  - key Ctrl+A
  - call RCP.COMMON.INPUT_TEXT text={contact}
  - wait ELEM.WIN.DEMOCHAT.CONTACT_RESULT shown 5s
  - click ELEM.WIN.DEMOCHAT.CONTACT_RESULT
  - wait ELEM.WIN.DEMOCHAT.PROFILE_CARD shown 5s
check:
  - ELEM.WIN.DEMOCHAT.PROFILE_NAME text == {contact}
ends_at: ELEM.WIN.DEMOCHAT.PROFILE_CARD
evidence: simulated, 3 runs passed check
counterexample: a name with no match leaves the result list empty
state: stable
verified: {count: 3, last: 2026-11-12}
---
id: RCP.WIN.DEMOCHAT.RENAME_REMARK
applies:
  os: WIN >=10.0
  app: DEMOCHAT >=4.0
requires:
  - ELEM.WIN.DEMOCHAT.MAIN visible
steps:
  - call RCP.WIN.DEMOCHAT.OPEN_PROFILE contact={contact}
  - move_window ELEM.WIN.DEMOCHAT.PROFILE_CARD away_from ELEM.WIN.DEMOCHAT.MAIN
  - click ELEM.WIN.DEMOCHAT.REMARK_ROW
  - wait ELEM.WIN.DEMOCHAT.REMARK_EDIT shown 5s
  - key Ctrl+A
  - call RCP.COMMON.INPUT_TEXT text={remark}
  - key! Enter
check:
  - ELEM.WIN.DEMOCHAT.PROFILE_REMARK value == {remark}
ends_at: ELEM.WIN.DEMOCHAT.PROFILE_CARD
notes:
  en: Step 2 exists because of FAIL.WIN.DEMOCHAT.CARD_BEHIND
  zh: 第 2 步的原因见 FAIL.WIN.DEMOCHAT.CARD_BEHIND
evidence: simulated on 4.1, 3 runs passed check
counterexample: contacts without a profile card have no remark row
state: stable
verified: {count: 3, last: 2026-11-12}
---
id: RCP.WIN.DEMOCHAT.SEND_FILE
applies:
  os: WIN >=10.0
  app: DEMOCHAT >=4.0
requires:
  - ELEM.WIN.DEMOCHAT.CHATS visible
steps:
  - click ELEM.WIN.DEMOCHAT.CHAT_SEARCH
  - key Ctrl+A
  - call RCP.COMMON.INPUT_TEXT text={contact}
  - click ELEM.WIN.DEMOCHAT.CHAT_RESULT
  - assert ELEM.WIN.DEMOCHAT.CHAT_TITLE text == {contact}
  - click ELEM.WIN.DEMOCHAT.ATTACH_BUTTON
  - wait ELEM.WIN.DEMOCHAT.FILE_PATH shown 5s
  - call RCP.COMMON.INPUT_TEXT text={file}
  - click! ELEM.WIN.DEMOCHAT.SEND_BUTTON
  - wait ELEM.WIN.DEMOCHAT.LAST_SENT shown 5s
check:
  - ELEM.WIN.DEMOCHAT.CHAT_TITLE text == {contact}
  - ELEM.WIN.DEMOCHAT.LAST_SENT text == {file}
ends_at: ELEM.WIN.DEMOCHAT.CHATS
evidence: simulated, 3 runs passed check
counterexample: a contact with no existing conversation is not in the chat search
state: stable
verified: {count: 3, last: 2026-11-12}
---
id: FAIL.WIN.DEMOCHAT.CARD_BEHIND
applies:
  os: WIN >=10.0
  app: DEMOCHAT >=4.0
symptom:
  en: Clicks on the profile card have no effect; the card opened behind the main window
  zh: 点击资料卡没有反应；资料卡在主窗口后面打开
conclusion:
  en: The card overlaps the main window; moving it clear before clicking makes clicks land
  zh: 资料卡与主窗口重叠；点击前先把它移出主窗口范围，点击才会生效
evidence: simulated, observed twice before the move step was added
state: reproduced
verified: {count: 2, last: 2026-11-12}
